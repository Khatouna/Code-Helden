<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article 01 / Carousel</title>



    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .slider-container {
            height: 300px;

            display: flex;
        }

        .slider-item {
            z-index: 1;
            width: 100px;
            height: 80%;

            
            box-shadow: 0px 4px 3px rgba(3, 7, 18, 0.03),
                0px 14px 11px rgba(3, 7, 18, 0.05),
                0px 32px 24px rgba(3, 7, 18, 0.08);


            transform: perspective(250px) rotateY(20deg) translateX(-20px);
            transform-origin: 50% 50%;
        }

        .slider-item:hover {
            z-index: 3 ;
            transform: perspective(250px) rotateY(0deg) translateX(0px) scaleX(1.5) scaleY(1.2);
        }
    </style>




</head>

<body>



    <section class="destinations-section">

        <div class="slider-container">

            <div>
                <img class="slider-item" src="./assets/img/carousel/carousel-1.png" alt="Beach destination 1">
            </div>

            <div>
                <img class="slider-item" src="./assets/img/carousel/carousel-2.png" alt="Beach destination 2">
            </div>

            <div>
                <img class="slider-item" src="./assets/img/carousel/carousel-3.png" alt="Beach destination 3">
            </div>

            <div>
                <img class="slider-item" src="./assets/img/carousel/carousel-4.png" alt="Beach destination 4">
            </div>

            <div>
                <img class="slider-item" src="./assets/img/carousel/carousel-5.png" alt="Beach destination 5">
            </div>

        </div>
    </section>








</body>

</html>
